[project]
name = "fedspeak-mcp-server"
version = "1.0.0"
description = "MCP server for Federal Reserve statements and data analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.2.0",
    "firebase-admin>=6.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "anyio>=4.0.0",
    "typing-extensions>=4.5.0"
]

[build-system]
requires = ["hatchling",]
build-backend = "hatchling.build"

[project.scripts]
fedspeak = "fedspeak:main"
fedspeak-mcp-server = "fedspeak:main"

[tool.uv]
dev-dependencies = ["pyright>=1.1.378"]

[tool.hatch.build]
packages = ["src/fedspeak"]
